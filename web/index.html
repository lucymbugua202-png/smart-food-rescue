<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>Smart Food Rescue - Reduce Food Waste, Feed Communities</title>
  
  <!-- iOS Safari Meta Tags for PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FoodRescue">
  <meta name="mobile-web-app-capable" content="yes">
  
  <!-- iOS App Icons -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='100' fill='%232E7D32'/%3E%3Ccircle cx='256' cy='256' r='180' fill='%23FF9800'/%3E%3Cpath d='M256 140 L300 220 L380 220 L320 280 L340 360 L256 310 L172 360 L192 280 L132 220 L212 220 Z' fill='white'/%3E%3C/svg%3E">
  
  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Meta tags -->
  <meta name="description" content="Smart Food Rescue - Connect food donors with communities in need.">
  <meta name="theme-color" content="#2E7D32">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
    
    body {
      background-color: #2E7D32;
      -webkit-tap-highlight-color: transparent;
    }
    
    /* Flutter canvas container */
    flutter-view {
      width: 100%;
      height: 100%;
      display: block;
    }
    
    /* iOS PWA specific fixes */
    @media all and (display-mode: standalone) {
      body {
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      
      flutter-view {
        height: calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      }
    }
    
    /* iPhone X and newer notch support */
    @supports (padding: max(0px)) {
      body {
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
    }
  </style>
</head>
<body>
  <script>
    // Fix for iOS home screen viewport
    (function() {
      if (window.navigator.standalone === true) {
        document.body.style.paddingTop = 'env(safe-area-inset-top)';
        document.body.style.paddingBottom = 'env(safe-area-inset-bottom)';
        document.body.style.paddingLeft = 'env(safe-area-inset-left)';
        document.body.style.paddingRight = 'env(safe-area-inset-right)';
      }
      
      // Prevent zoom on double tap
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });
    })();
  </script>
  <script src="main.dart.js" type="application/javascript"></script>
</body>
</html>
